name: docker-publish

# 两个 tag，下载方式不同、其余相同（都不含游戏本体）：
#   latest-slim     - steamcmd 版，linux/amd64 only
#   latest-slim-dd  - DepotDownloader 版，linux/amd64 only
# 两者容器内路径一致（本体 /opt/dst_server、配置存档 /data），可以读同一份宿主机 data/。
# Registries: GitHub Container Registry (always) + Docker Hub (when secrets exist).

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC, to pick up Debian security updates
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io

env:
  LOCAL_IMAGE: dst-server:ci
  TAG_SLIM: latest-slim
  LOCAL_IMAGE_DD: dst-server:dd-ci
  TAG_DD: latest-slim-dd

jobs:
  build-slim:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, keep it locally for the checks below.
      # No steamcmd pre-warming: the image ships the 6MB bootstrap only (~69MB compressed).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Klei ships x86/x64 binaries only, never add arm64
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test (glibc / i386 / steamcmd / entrypoint)
        run: |
          set -eux
          docker run --rm --entrypoint bash "${LOCAL_IMAGE}" -c '
            set -eux
            /lib/x86_64-linux-gnu/libc.so.6 | head -1
            /lib/i386-linux-gnu/libc.so.6   | head -1
            glibc=$(/lib/x86_64-linux-gnu/libc.so.6 | head -1 | grep -oE "2\.[0-9]+" | head -1)
            [ "$(printf "%s\n2.29\n" "$glibc" | sort -V | tail -1)" = "$glibc" ] || { echo "glibc too old: $glibc"; exit 1; }
            test -x /opt/steamcmd/steamcmd.sh
            test -x /usr/local/bin/entrypoint.sh
            test -x /usr/local/bin/healthcheck.sh
            test -x /usr/local/bin/dst-server
            test -f /etc/supervisor/supervisord.conf
          '

      # entrypoint exports these ENV_* values; supervisord must be able to expand them
      - name: Validate supervisord config
        run: |
          set -eux
          docker run --rm -i --entrypoint python3 "${LOCAL_IMAGE}" - <<'PY'
          from supervisor.options import ServerOptions
          ServerOptions().realize(["-c", "/etc/supervisor/supervisord.conf"])
          print("supervisord config ok")
          PY

      # latest-slim must NOT contain the game itself
      - name: Assert image has no DST game files
        run: |
          set -eux
          docker run --rm --entrypoint bash "${LOCAL_IMAGE}" -c '
            set -eux
            test -d /opt/dst_server
            test -z "$(ls -A /opt/dst_server)"
            test ! -e /opt/dst_server/bin
            test ! -e /opt/dst_server/bin64
            if find / -xdev -name "dontstarve_dedicated_server_nullrenderer*" 2>/dev/null | grep -q .; then
              echo "game binaries found inside the image!"; exit 1
            fi
          '

      - name: Report image size
        run: |
          set -eux
          bytes=$(docker image inspect "${LOCAL_IMAGE}" --format '{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "uncompressed image size: ${mb}MiB"
          echo "### latest-slim size: ${mb}MiB (uncompressed)" >> "$GITHUB_STEP_SUMMARY"
          # slim build should stay lean; a big jump means something got baked in by mistake
          [ "$mb" -lt 250 ] || { echo "image grew unexpectedly (${mb}MiB)"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check Docker Hub secrets
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set, skipping Docker Hub push"
          fi

      - name: Push to GHCR
        run: |
          set -eux
          IMAGE="ghcr.io/${{ github.repository_owner }}/dst-server:${TAG_SLIM}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "### GHCR: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eux
          echo "${DH_TOKEN}" | docker login docker.io -u "${DH_USER}" --password-stdin
          IMAGE="${DH_USER}/dst-server:${TAG_SLIM}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "### Docker Hub: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

  # latest-slim-dd：DepotDownloader 版。运行环境和 latest-slim 相同，只是把 steamcmd 换成
  # DepotDownloader（单文件 .NET 程序，arm 的模拟层里也能正常跑）。
  build-dd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/DepotDownloader/Dockerfile
          platforms: linux/amd64 # 服务端只有 x64 二进制，arm 主机靠 Rosetta / QEMU 模拟
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE_DD }}
          cache-from: type=gha,scope=dd
          cache-to: type=gha,mode=max,scope=dd
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test (runtime env / DepotDownloader)
        run: |
          set -eux
          docker run --rm --entrypoint bash "${LOCAL_IMAGE_DD}" -c '
            set -eux
            /lib/x86_64-linux-gnu/libc.so.6 | head -1
            /lib/i386-linux-gnu/libc.so.6   | head -1
            glibc=$(/lib/x86_64-linux-gnu/libc.so.6 | head -1 | grep -oE "2\.[0-9]+" | head -1)
            [ "$(printf "%s\n2.29\n" "$glibc" | sort -V | tail -1)" = "$glibc" ] || { echo "glibc too old: $glibc"; exit 1; }
            test -x /usr/local/bin/DepotDownloader
            test -x /usr/local/bin/dst-depot
            test -x /usr/local/bin/entrypoint.sh
            test -x /usr/local/bin/healthcheck.sh
            test -x /usr/local/bin/dst-server
            test -f /etc/supervisor/supervisord.conf
            test -f /licenses/DepotDownloader-LICENSE
            test ! -e /opt/steamcmd
          '

      - name: Validate supervisord config
        run: |
          set -eux
          docker run --rm -i --entrypoint python3 "${LOCAL_IMAGE_DD}" - <<'PY'
          from supervisor.options import ServerOptions
          ServerOptions().realize(["-c", "/etc/supervisor/supervisord.conf"])
          print("supervisord config ok")
          PY

      - name: Assert image has no DST game files
        run: |
          set -eux
          docker run --rm --entrypoint bash "${LOCAL_IMAGE_DD}" -c '
            set -eux
            test -d /opt/dst_server
            test -z "$(ls -A /opt/dst_server)"
            test ! -e /opt/dst_server/bin
            test ! -e /opt/dst_server/bin64
            if find / -xdev -name "dontstarve_dedicated_server_nullrenderer*" 2>/dev/null | grep -q .; then
              echo "game binaries found inside the image!"; exit 1
            fi
          '

      # DepotDownloader defaults / env override / raw passthrough must be exact
      - name: Smoke test (DepotDownloader arguments)
        run: |
          set -eux
          out=$(docker run --rm -e DST_DEPOT_DRYRUN=1 "${LOCAL_IMAGE_DD}" dst-depot)
          [ "${out}" = "-app 343050 -os linux -osarch 64 -branch public -dir /opt/dst_server -validate" ]

          out=$(docker run --rm -e DST_DEPOT_DRYRUN=1 -e DST_DEPOT_OSARCH=32 -e DST_DEPOT_VALIDATE=0 \
                  "${LOCAL_IMAGE_DD}" dst-depot)
          [ "${out}" = "-app 343050 -os linux -osarch 32 -branch public -dir /opt/dst_server" ]

          # 手动传参：entrypoint 看到前导 "-" 就直接交给 DepotDownloader
          out=$(docker run --rm -e DST_DEPOT_DRYRUN=1 "${LOCAL_IMAGE_DD}" -app 343050 -osarch 32 -dir /opt/dst_server)
          [ "${out}" = "-app 343050 -osarch 32 -dir /opt/dst_server" ]

      # 完整启动流程的 dry-run：初始化配置 + 打印下载命令 + 不启动服务器
      - name: Smoke test (server start-up dry run)
        run: |
          set -eux
          out=$(docker run --rm -e DST_CLUSTER_TOKEN=ci-dummy -e DST_DEPOT_DRYRUN=1 "${LOCAL_IMAGE_DD}")
          printf '%s\n' "${out}"
          printf '%s\n' "${out}" | grep -q -- "-dir /opt/dst_server"
          printf '%s\n' "${out}" | grep -q "只打印命令，不启动服务器"

      - name: Report image size
        run: |
          set -eux
          bytes=$(docker image inspect "${LOCAL_IMAGE_DD}" --format '{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "uncompressed downloader-variant image size: ${mb}MiB"
          echo "### latest-slim-dd size: ${mb}MiB (uncompressed)" >> "$GITHUB_STEP_SUMMARY"
          # debian bookworm + supervisor + i386 库 + DepotDownloader(82MB) ≈ 321MB
          [ "$mb" -lt 380 ] || { echo "image grew unexpectedly (${mb}MiB)"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check Docker Hub secrets
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set, skipping Docker Hub push"
          fi

      - name: Push to GHCR
        run: |
          set -eux
          IMAGE="ghcr.io/${{ github.repository_owner }}/dst-server:${TAG_DD}"
          docker tag "${LOCAL_IMAGE_DD}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "### GHCR: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eux
          echo "${DH_TOKEN}" | docker login docker.io -u "${DH_USER}" --password-stdin
          IMAGE="${DH_USER}/dst-server:${TAG_DD}"
          docker tag "${LOCAL_IMAGE_DD}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "### Docker Hub: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Digests
        run: |
          set -eux
          docker image inspect "${LOCAL_IMAGE_DD}" --format '{{json .RepoDigests}}' || true
