name: docker-publish

# Two tags are published, neither contains game files:
#   latest-slim     - runtime image, linux/amd64 only (Klei ships no arm64 server)
#   latest-slim-dd  - DepotDownloader helper, linux/amd64 + linux/arm64, so arm64 hosts
#                     can download the game files natively (no steamcmd under emulation)
# Registries: GitHub Container Registry (always) + Docker Hub (when secrets exist).

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC, to pick up Debian security updates
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to ghcr.io

env:
  LOCAL_IMAGE: dst-server:ci
  TAG_SLIM: latest-slim
  LOCAL_IMAGE_DD: dst-server:dd-ci
  TAG_DD: latest-slim-dd

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once, keep it locally for the checks below.
      # No steamcmd pre-warming: the image ships the 6MB bootstrap only (~69MB compressed).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Klei ships x86/x64 binaries only, never add arm64
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test (glibc / i386 / steamcmd / entrypoint)
        run: |
          set -eux
          docker run --rm --entrypoint bash "${LOCAL_IMAGE}" -c '
            set -eux
            /lib/x86_64-linux-gnu/libc.so.6 | head -1
            /lib/i386-linux-gnu/libc.so.6   | head -1
            glibc=$(/lib/x86_64-linux-gnu/libc.so.6 | head -1 | grep -oE "2\.[0-9]+" | head -1)
            [ "$(printf "%s\n2.29\n" "$glibc" | sort -V | tail -1)" = "$glibc" ] || { echo "glibc too old: $glibc"; exit 1; }
            test -x /opt/steamcmd/steamcmd.sh
            test -x /usr/local/bin/entrypoint.sh
            test -x /usr/local/bin/healthcheck.sh
            test -x /usr/local/bin/dst-server
            test -f /etc/supervisor/supervisord.conf
          '

      # entrypoint exports these ENV_* values; supervisord must be able to expand them
      - name: Validate supervisord config
        run: |
          set -eux
          docker run --rm -i --entrypoint python3 "${LOCAL_IMAGE}" - <<'PY'
          from supervisor.options import ServerOptions
          ServerOptions().realize(["-c", "/etc/supervisor/supervisord.conf"])
          print("supervisord config ok")
          PY

      # latest-slim must NOT contain the game itself
      - name: Assert image has no DST game files
        run: |
          set -eux
          docker run --rm --entrypoint bash "${LOCAL_IMAGE}" -c '
            set -eux
            test -d /opt/dst_server
            test -z "$(ls -A /opt/dst_server)"
            test ! -e /opt/dst_server/bin
            test ! -e /opt/dst_server/bin64
            if find / -xdev -name "dontstarve_dedicated_server_nullrenderer*" 2>/dev/null | grep -q .; then
              echo "game binaries found inside the image!"; exit 1
            fi
          '

      - name: Report image size
        run: |
          set -eux
          bytes=$(docker image inspect "${LOCAL_IMAGE}" --format '{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "uncompressed image size: ${mb}MiB"
          echo "### Image size: ${mb}MiB (uncompressed)" >> "$GITHUB_STEP_SUMMARY"
          # slim build should stay lean; a big jump means something got baked in by mistake
          [ "$mb" -lt 250 ] || { echo "image grew unexpectedly (${mb}MiB)"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GHCR
        run: |
          set -eux
          IMAGE="ghcr.io/${{ github.repository_owner }}/dst-server:${TAG_SLIM}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "### GHCR: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check Docker Hub secrets
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set, skipping Docker Hub push"
          fi

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eux
          echo "${DH_TOKEN}" | docker login docker.io -u "${DH_USER}" --password-stdin
          IMAGE="${DH_USER}/dst-server:${TAG_SLIM}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "### Docker Hub: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Digests
        run: |
          set -eux
          docker image inspect "${LOCAL_IMAGE}" --format '{{json .RepoDigests}}' || true

  # latest-slim-dd: DepotDownloader 的薄封装（只加了一层 entrypoint + 默认参数）。
  # 基础镜像 hufang360/depotdownloader 本身就是多架构，且这里没有任何 RUN
  # 里的交叉运行，所以不需要 setup-qemu 也能构建 arm64 变体。
  build-push-downloader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build downloader image (amd64, for checks)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/DepotDownloader/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE_DD }}
          cache-from: type=gha,scope=dd
          cache-to: type=gha,mode=max,scope=dd

      # 默认参数 / 环境变量覆盖 / 原样透传 三种用法都要对，且镜像里不能有游戏本体
      - name: Smoke test (defaults / env override / passthrough)
        run: |
          set -eux
          out=$(docker run --rm -e DST_DEPOT_DRYRUN=1 "${LOCAL_IMAGE_DD}")
          [ "${out}" = "-app 343050 -os linux -osarch 64 -branch public -dir /steam -validate" ]

          out=$(docker run --rm -e DST_DEPOT_DRYRUN=1 \
                  -e DST_DEPOT_OSARCH=32 -e DST_DEPOT_VALIDATE=0 "${LOCAL_IMAGE_DD}")
          [ "${out}" = "-app 343050 -os linux -osarch 32 -branch public -dir /steam" ]

          out=$(docker run --rm -e DST_DEPOT_DRYRUN=1 "${LOCAL_IMAGE_DD}" \
                  -app 343050 -osarch 32 -dir /steam)
          [ "${out}" = "-app 343050 -osarch 32 -dir /steam" ]

          docker run --rm --entrypoint sh "${LOCAL_IMAGE_DD}" -c '
            set -eux
            test -x /usr/local/bin/DepotDownloader
            test -x /usr/local/bin/entrypoint.sh
            test -x /usr/local/bin/dst-depot-entrypoint.sh
            test -z "$(ls -A /steam)"
          '

      - name: Report image size
        run: |
          set -eux
          bytes=$(docker image inspect "${LOCAL_IMAGE_DD}" --format '{{.Size}}')
          mb=$(( bytes / 1024 / 1024 ))
          echo "uncompressed downloader image size: ${mb}MiB"
          echo "### latest-slim-dd size: ${mb}MiB (uncompressed)" >> "$GITHUB_STEP_SUMMARY"
          # 基础镜像（含 DepotDownloader 单文件二进制）约 230MB，留点余量
          [ "$mb" -lt 400 ] || { echo "downloader image grew unexpectedly (${mb}MiB)"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check Docker Hub secrets
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "${DH_TOKEN}" | docker login docker.io -u "${DH_USER}" --password-stdin
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set, skipping Docker Hub push"
          fi

      - name: Resolve target tags
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          set -eux
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/dst-server:${TAG_DD}"
            if [ "${DH_ENABLED}" = "true" ]; then
              echo "${DH_USER}/dst-server:${TAG_DD}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 一次构建同时出 amd64 + arm64 两个 manifest；两部分内容完全一样
      - name: Push multi-arch (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/DepotDownloader/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=dd
          cache-to: type=gha,mode=max,scope=dd
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify both platforms are published
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          set -eux
          refs=("ghcr.io/${{ github.repository_owner }}/dst-server:${TAG_DD}")
          if [ "${DH_ENABLED}" = "true" ]; then
            refs+=("${DH_USER}/dst-server:${TAG_DD}")
          fi
          for ref in "${refs[@]}"; do
            manifest=$(docker buildx imagetools inspect "${ref}")
            printf '%s\n' "${manifest}"
            printf '%s\n' "${manifest}" | grep -q 'linux/amd64'
            printf '%s\n' "${manifest}" | grep -q 'linux/arm64'
            echo "### ${ref}: amd64 + arm64" >> "$GITHUB_STEP_SUMMARY"
          done
